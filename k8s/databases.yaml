apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: customer-mongo-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-mongo
  labels:
    app: customer-mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: customer-mongo
  template:
    metadata:
      labels:
        app: customer-mongo
    spec:
      enableServiceLinks: false
      containers:
        - name: mongo
          image: mongo:8.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: admin
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-env
                  key: MONGO_ROOT_PASSWORD
            # User of the service, created by the script below the first time the volume is empty.
            - name: CUSTOMER_DB_USERNAME
              value: customers
            - name: CUSTOMER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-env
                  key: CUSTOMER_DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: customer-mongo-data
        - name: init
          configMap:
            name: mongo-init
            items:
              - key: create-customer-user.js
                path: create-customer-user.js
---
apiVersion: v1
kind: Service
metadata:
  name: customer-mongo
  labels:
    app: customer-mongo
spec:
  selector:
    app: customer-mongo
  ports:
    - port: 27017
      targetPort: 27017
