# One database per service, each with its own volume, like infra/docker-compose.yml. The
# passwords come from the Secret banking-env, generated from the .env file of this repository.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: account-postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-postgres
  labels:
    app: account-postgres
spec:
  replicas: 1
  # One database, one volume: the old pod leaves before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: account-postgres
  template:
    metadata:
      labels:
        app: account-postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: accounts_db
            - name: POSTGRES_USER
              value: accounts
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-env
                  key: ACCOUNT_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "accounts", "-d", "accounts_db"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: account-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: account-postgres
  labels:
    app: account-postgres
spec:
  selector:
    app: account-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
